name: Build setup.apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q project.zip -d extracted
          cp patch/MainActivity.java extracted/CoupleFinance_Mobile_Android_V2_VIEWER/app/src/main/java/com/couplefinance/mobile/MainActivity.java
          cp patch/XlsxAppender.java extracted/CoupleFinance_Mobile_Android_V2_VIEWER/app/src/main/java/com/couplefinance/mobile/XlsxAppender.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/CoupleFinance_Mobile_Android_V2_VIEWER
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../setup.apk

      - name: Upload setup.apk
        uses: actions/upload-artifact@v4
        with:
          name: CoupleFinance-setup-apk
          path: setup.apk
          if-no-files-found: error
